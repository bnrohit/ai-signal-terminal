name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: pytest
      - run: python -m compileall signal_terminal app.py
      - name: Streamlit smoke test
        shell: bash
        run: |
          python -m streamlit run app.py --server.address=127.0.0.1 --server.port=8501 --server.headless=true > /tmp/streamlit.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health | grep -qi ok; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          exit 1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ai-signal-terminal:ci
